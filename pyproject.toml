[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetune-eval-suite"
version = "0.1.0"
description = "A professional-grade LLM QLoRA fine-tuning, telemetry tracking, and benchmark evaluation suite."
readme = "README.md"
authors = [
    { name = "OpenSource Contributor", email = "developer@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "rouge-score>=0.1.2",
    "pandas>=2.0.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
