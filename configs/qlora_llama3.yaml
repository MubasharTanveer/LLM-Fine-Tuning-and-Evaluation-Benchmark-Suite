# Configuration for Meta LLaMA 3 8B Fine-Tuning

project:
  name: "llama3-8b-domain-fine-tuning"
  seed: 1337
  output_dir: "./outputs/llama3_qlora_domain"

model:
  base_model_name_or_path: "meta-llama/Meta-Llama-3-8B-Instruct"
  torch_dtype: "bfloat16"
  use_unsloth: true
  max_seq_length: 4096
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.00015
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  num_train_epochs: 3
  max_steps: -1
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  save_total_limit: 3
  optim: "adamw_torch"
  fp16: false
  bf16: true
  gradient_checkpointing: true

wandb:
  enabled: true
  project: "llm-fine-tuning-benchmark"
  run_name: "llama3-8b-qlora-r32"
  track_telemetry: true

data:
  train_file: "./data/sample_instruction_data.json"
  eval_file: "./data/sample_instruction_data.json"
